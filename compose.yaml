services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    expose:
      - "8081"
    environment:
      PYTHONPATH: /app

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PYTHONPATH: /app
      GAN_BUSTERS_API_URL: http://api:8080
    depends_on:
      - api