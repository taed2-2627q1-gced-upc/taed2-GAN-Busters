services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    ports:
      - "40511:40511"
    environment:
      PYTHONPATH: /app

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    ports:
      - "40510:40510"
    environment:
      PYTHONPATH: /app
      GAN_BUSTERS_API_URL: http://api:40511
    depends_on:
      - api