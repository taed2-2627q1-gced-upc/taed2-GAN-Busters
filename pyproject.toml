[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "gan_busters"
version = "0.0.1"
description = "Supervised binary image classification component for distinguishing between real and AI generated images."
authors = [
  { name = "GAN-Busters" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "~=3.10.0"


[tool.ruff]
line-length = 99
src = ["gan_busters"]
include = ["pyproject.toml", "gan_busters/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["gan_busters"]
force-sort-within-sections = true

